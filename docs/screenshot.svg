<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <style>
    .bg { fill: #1a1a1a; }
    .term { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace; font-size: 13.5px; }
    .bold { font-weight: 700; }
    .faint { opacity: 0.45; }
    .selected { fill: #e879a0; font-weight: 700; }
    .dim { fill: #94a3b8; }
    .green { fill: #22c55e; }
    .yellow { fill: #eab308; }
    .red { fill: #ef4444; }
    .grey { fill: #64748b; }
    .hint { fill: #94a3b8; opacity: 0.55; }
  </style>

  <rect width="900" height="480" rx="10" class="bg"/>
  <rect width="900" height="36" rx="10" fill="#2a2a2a"/>
  <rect y="26" width="900" height="10" fill="#2a2a2a"/>
  <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="58" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#888">aws-green</text>

  <g class="term" fill="#e2e8f0" transform="translate(24, 60)">

    <text x="0" y="0" class="bold" fill="#e2e8f0">aws-green</text>

    <!-- project row 1: selected, expanded, yellow (pipeline in progress) -->
    <text x="0" y="28" class="selected">▼ 🟡  my-app</text>
    <text x="180" y="28" class="hint">  Pipeline 🟡  Stacks 🟢  ECS 🟢</text>

    <!-- pipeline section -->
    <text x="0" y="54" class="dim">      pipeline  my-app-DeploymentPipeline-abc123</text>

    <!-- stages -->
    <text x="0"  y="76" class="green">        ✓</text><text x="78" y="76" fill="#e2e8f0">  Source</text>
    <text x="0"  y="98" class="green">        ✓</text><text x="78" y="98" fill="#e2e8f0">  Build</text>
    <text x="0" y="120" class="yellow">        ●</text><text x="78" y="120" fill="#e2e8f0">  Deploy                  2m34s</text>
    <text x="0" y="142" class="grey">        ○</text><text x="78" y="142" class="dim">  Approve</text>

    <!-- stacks section -->
    <text x="0" y="166" class="dim">      stacks</text>
    <text x="0" y="188" class="green">        🟢</text><text x="78" y="188" fill="#e2e8f0">  my-app-cluster                           </text><text x="400" y="188" class="dim">UPDATE_COMPLETE</text>
    <text x="0" y="210" class="green">        🟢</text><text x="78" y="210" fill="#e2e8f0">  my-app-service                           </text><text x="400" y="210" class="dim">UPDATE_COMPLETE</text>

    <!-- ecs section -->
    <text x="0" y="234" class="dim">      ecs</text>
    <text x="0" y="256" class="green">        🟢</text><text x="78" y="256" fill="#e2e8f0">  my-app-web                               </text><text x="400" y="256" class="dim">3/3</text>
    <text x="0" y="278" class="green">        🟢</text><text x="78" y="278" fill="#e2e8f0">  my-app-worker                            </text><text x="400" y="278" class="dim">2/2</text>

    <!-- project row 2: green, collapsed -->
    <text x="0" y="308" fill="#e2e8f0">  ▶ 🟢  store-api</text>
    <text x="168" y="308" class="hint">  Pipeline 🟢  Stacks 🟢  ECS 🟢</text>

    <!-- project row 3: red, collapsed -->
    <text x="0" y="334" fill="#e2e8f0">  ▶ 🔴  data-pipeline</text>
    <text x="188" y="334" class="hint">  Pipeline 🔴  Stacks 🟢</text>

    <text x="0" y="420" class="hint">↑/↓ navigate  enter/space expand  o open  r refresh  q quit  ? help</text>
  </g>
</svg>
