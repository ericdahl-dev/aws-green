<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <style>
    .bg { fill: #1a1a1a; }
    .term { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace; font-size: 13.5px; }
    .bold { font-weight: 700; }
    .faint { opacity: 0.45; }
    .selected { fill: #e879a0; font-weight: 700; }
    .dim { fill: #94a3b8; }
    .green { fill: #22c55e; }
    .yellow { fill: #eab308; }
    .red { fill: #ef4444; }
    .grey { fill: #64748b; }
  </style>

  <rect width="820" height="400" rx="10" class="bg"/>
  <rect width="820" height="36" rx="10" fill="#2a2a2a"/>
  <rect y="26" width="820" height="10" fill="#2a2a2a"/>
  <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="58" cy="18" r="6" fill="#27c93f"/>
  <text x="410" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#888">aws-green</text>

  <g class="term" fill="#e2e8f0" transform="translate(24, 58)">

    <text x="0" y="0" class="bold" fill="#e2e8f0">aws-green</text>

    <!-- pipeline row: selected, expanded, yellow (Test stage in progress) -->
    <text x="0" y="28" class="selected">▼ 🟡  default / annex-ims-deployment</text>

    <!-- stages -->
    <text x="0"  y="58" class="green">      ✓</text><text x="70" y="58" fill="#e2e8f0">  Source</text>
    <text x="0"  y="80" class="green">      ✓</text><text x="70" y="80" fill="#e2e8f0">  ClusterCreation</text>
    <text x="0" y="102" class="yellow">      ●</text><text x="70" y="102" fill="#e2e8f0">  Test</text>
    <text x="0" y="124" class="grey">      ○</text><text x="70" y="124" class="dim">  Production  ⊘ transition disabled</text>

    <!-- second pipeline: green -->
    <text x="0" y="158" fill="#e2e8f0">  ▶ 🟢  default / another-pipeline                    Succeeded</text>

    <!-- third pipeline: red -->
    <text x="0" y="184" fill="#e2e8f0">  ▶ 🔴  staging / infra-pipeline                       Failed</text>

    <text x="0" y="340" class="faint" fill="#94a3b8">↑/↓ navigate  enter/space expand  o open  r refresh  q quit  ? help</text>
  </g>
</svg>
